[package]
name = "Prestarter"
version = "0.1.1"
description = "A Tauri App"
authors = ["Gravita", "microwin7"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "prestarter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
anyhow = "1.0"
thiserror = "2.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
dirs-next = "2.0"
chrono = { version = "0.4.41", features = ["serde"] }
flate2 = "1.1.2"
tar = "0.4.46"

[patch.crates-io]
tao = { git = "https://github.com/GravitLauncher6/tao.git", branch = "dev" }

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "z" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.
