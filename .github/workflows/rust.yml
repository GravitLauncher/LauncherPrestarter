name: Manual Build (All Platforms)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ветка/тег для сборки'
        required: false
        default: 'rust/5.7.x'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-aarch64
            os: windows-latest
            target: aarch64-pc-windows-msvc
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux deps (webkitgtk и т.п.)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install yarn
        run: npm install --global yarn

      - name: Install frontend deps
        run: yarn install --frozen-lockfile

      - name: Build (tauri, target ${{ matrix.target }})
        run: yarn tauri build --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prestarter-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            src-tauri/target/${{ matrix.target }}/release/Prestarter
            src-tauri/target/${{ matrix.target }}/release/Prestarter.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-builds

      - name: Zip everything together
        run: |
          cd all-builds
          zip -r ../all-platforms-builds.zip .

      - name: Upload combined archive
        uses: actions/upload-artifact@v4
        with:
          name: all-platforms-builds
          path: all-platforms-builds.zip
